services:
  nginx-proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '80:80'
    depends_on:
      - node-app

  node-app:
    build: .
    environment:
      - REDIS_HOST=redis-server
    deploy:
      replicas: 3
    depends_on:
      - redis-server

  redis-server:
    image: 'redis:alpine'
    volumes:
      - redis-data:/data

volumes:
  redis-data:
