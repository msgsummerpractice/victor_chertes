services:
  nginx-proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '80:80'
    depends_on:
      - node-app

  node-app:
    build: .
    environment:
      - REDIS_HOST=redis-server
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 50M
    secrets:
      - db_password
    depends_on:
      - redis-server

  redis-server:
    image: 'redis:alpine'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 50M
    volumes:
      - redis-data:/data

  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles:
      - tools
    environment:
      - REDIS_HOSTS=local:redis-server:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis-server

secrets:
  db_password:
    file: ./db_password.txt

volumes:
  redis-data:
