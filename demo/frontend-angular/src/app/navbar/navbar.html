<mat-toolbar color="primary" class="fixed top-0 left-0 w-full z-50 shadow-md">
  <div class="flex justify-between items-center w-full px-4">
    
    <div class="flex items-center gap-2">
      
      <button mat-icon-button class="md:hidden" [matMenuTriggerFor]="mobileMenu" aria-label="Deschide meniul">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="font-bold text-xl tracking-wide mr-4">DogApp</span>
      
      <div class="hidden md:flex gap-2">
        <a mat-button href="#">Home</a>
        <a mat-button href="#">Gallery</a>
      </div>
      
    </div>

    <div>
      <button mat-icon-button aria-label="User login">
        <mat-icon>person</mat-icon>
      </button>
    </div>

  </div>
</mat-toolbar>

<mat-menu #mobileMenu="matMenu">
  <a mat-menu-item href="#">
    <mat-icon>home</mat-icon>
    <span>Home</span>
  </a>
  <a mat-menu-item href="#">
    <mat-icon>pets</mat-icon>
    <span>Gallery</span>
  </a>
</mat-menu>
