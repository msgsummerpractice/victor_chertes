<div class="border border-gray-200 bg-white rounded-xl p-5 shadow-sm hover:shadow-md transition-shadow">
  @if (imageUrl()) {
    <img [src]="imageUrl()" [alt]="name()" class="w-full h-48 object-cover rounded-lg mb-4 shadow-sm">
  } @else {
    <div class="bg-gray-200 w-full h-48 rounded-lg mb-4 flex items-center justify-center">
      @if (isLoading()) { <span class="animate-pulse text-gray-500">Loading...</span> }
    </div>
  }
  <h2 class="text-xl font-semibold text-gray-900 mb-2">{{ name() | capitalizeAndSmile }}</h2>
  <p class="text-gray-600 text-sm">{{ description() }}</p>
</div>
