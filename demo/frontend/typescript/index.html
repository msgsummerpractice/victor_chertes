<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Gallery</title>
    <style>
        #dog-image { max-width: 500px; display: none; margin-top: 20px; border-radius: 10px; }
        #loading { display: none; color: blue; font-weight: bold; }
        #error { display: none; color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Random Dog Gallery</h1>
    
    <button id="fetch-btn">Show me a dog!</button>
    
    <p id="loading">We are bringing your dog</p>
    <p id="error">There has been an error fetching your dog</p>
    
    <div>
        <img id="dog-image" src="" alt="A random dog">
    </div>

    <script src="script.js"></script>
</body>
</html>
